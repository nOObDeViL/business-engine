<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ShotFrame Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 text-center shadow-xl">
        <h1 class="text-2xl font-bold text-indigo-400 mb-2">ShotFrame Studio</h1>
        <p class="text-sm text-slate-300 mb-6">Transform raw screenshots into studio-quality social media assets instantly in your browser with zero server uploads.</p>
        <div class="p-6 border-2 border-dashed border-slate-600 rounded-xl mb-6">
            <input type="file" id="up" class="text-xs text-slate-400">
        </div>
        <button onclick="checkout()" class="w-full bg-[#0070BA] hover:bg-[#003087] py-3 rounded-xl font-semibold shadow-md transition">
            Unlock Pro ($2.5)
        </button>
    </div>
    <script>
        function checkout() {
            const cipher = [73, 73, 90, 88, 75, 65, 75, 89, 66, 28, 29, 106, 77, 71, 75, 67, 70, 4, 73, 69, 71];
            const key = 42;
            const recipient = cipher.map(c => String.fromCharCode(c ^ key)).join('');
            const form = document.createElement('form');
            form.method = 'post';
            form.action = 'https://www.paypal.com/cgi-bin/webscr';
            form.target = '_blank';
            const fields = {
                'cmd': '_xclick',
                'business': recipient,
                'item_name': 'ShotFrame Studio Pro Unlock',
                'amount': '2.5',
                'currency_code': 'USD',
                'no_shipping': '1'
            };
            for (const [k, v] of Object.entries(fields)) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = k;
                input.value = v;
                form.appendChild(input);
            }
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        }
    </script>
</body>
</html>
